<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input & Rekap Keberangkatan Kapal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f6;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #333;
      margin-top: 0;
      margin-bottom: 20px;
    }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
    select, input[type="date"], button {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 15px;
    }
    button {
      background-color: #007bff;
      color: white;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background-color: #0056b3; }
    #statusMessage {
      margin-top: 15px;
      padding: 10px;
      border-radius: 4px;
      text-align: center;
      font-weight: bold;
      display: none;
    }
    
    /* Style Area Rekap */
    .rekap-frame-container {
      width: 100%;
      height: 400px;
      border: 1px solid #ddd;
      border-radius: 6px;
      overflow: hidden;
      margin-top: 10px;
      background: #fff;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Style Tombol Bawah */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-link {
      display: block;
      text-align: center;
      padding: 10px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: bold;
      color: white;
      font-size: 14px;
    }
    .btn-sheet { background-color: #28a745; }
    .btn-pdf { background-color: #dc3545; }
    .btn-refresh {
      background-color: #17a2b8;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      padding: 10px;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- CARD 1: FORM INPUT DATA -->
  <div class="card">
    <h2>🚢 Input Keberangkatan Kapal</h2>

    <form id="shipForm">
      <div class="form-group">
        <label for="namaKapal">Nama Kapal:</label>
        <select id="namaKapal" required>
          <option value="">-- Pilih Kapal --</option>
          <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
          <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
          <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
          <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
          <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
          <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
          <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
          <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
          <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
          <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
          <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
          <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
          <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
          <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
          <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>
          <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tanggalBerangkat">Hari/Tanggal Berangkat:</label>
        <input type="date" id="tanggalBerangkat" required>
      </div>

      <button type="submit" id="btnSubmit">🚀 Simpan Data</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <!-- CARD 2: HASIL REKAP SPREADSHEET (LIVE EMBED) -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
      <h2 style="margin: 0;">📋 Hasil Rekap Kapal Terinput</h2>
      <button type="button" onclick="refreshRekap()" class="btn-refresh">🔄 Refresh Rekap</button>
    </div>

  <!-- TAMPILAN TABEL REKAP REAL-TIME (TANPA DELAY CACHE) -->
<div class="rekap-frame-container">
  <iframe id="rekapFrame" 
          src="https://docs.google.com/spreadsheets/d/1HcWZUa7Bsvxu0gMCJy6-vVHb-jklOGxrx7af9YCxNnI/preview?rm=minimal">
  </iframe>
</div>

    <div class="button-group">
      <a href="https://docs.google.com/spreadsheets/d/1HcWZUa7Bsvxu0gMCJy6-vVHb-jklOGxrx7af9YCxNnI/edit?usp=sharing" target="_blank" class="btn-link btn-sheet">
        📊 Buka Spreadsheet
      </a>

      <a href="https://docs.google.com/spreadsheets/d/1HcWZUa7Bsvxu0gMCJy6-vVHb-jklOGxrx7af9YCxNnI/export?format=pdf&size=A4&portrait=true&fitw=true" target="_blank" class="btn-link btn-pdf">
        📄 Unduh Rekap PDF
      </a>
    </div>
  </div>

</div>

<script>
  // PASTE URL GOOGLE APPS SCRIPT ANDA DI SINI
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyRQ89ON01ZmGGE5I2BolFf6dUCtClhueTLz0caTQEGTvpUErX7-mcff27AOLgoq1BM6A/exec";

  const form = document.getElementById('shipForm');
  const btnSubmit = document.getElementById('btnSubmit');
  const statusMsg = document.getElementById('statusMessage');
  const rekapFrame = document.getElementById('rekapFrame');

  // Fungsi memuat ulang tabel rekap
  function refreshRekap() {
    const baseUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQGFG9yf87gX8nhRPwwZIKZovKm5grqVfe9xbGOn7ipep5_sqROdM75FSHka58LcGPs9EE2TKrTUKto/pubhtml?gid=0&single=true&widget=true&headers=false";
    rekapFrame.src = baseUrl + "&t=" + new Date().getTime();
  }

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    btnSubmit.disabled = true;
    btnSubmit.innerText = 'Mengirim data...';
    
    statusMsg.style.display = 'block';
    statusMsg.style.backgroundColor = '#e2e3e5';
    statusMsg.style.color = '#383d41';
    statusMsg.innerText = '⏳ Sedang menyimpan...';

    const payload = {
      namaKapal: document.getElementById('namaKapal').value,
      tanggalBerangkat: document.getElementById('tanggalBerangkat').value
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      statusMsg.style.backgroundColor = '#d4edda';
      statusMsg.style.color = '#155724';
      statusMsg.innerText = '✅ DATA BERHASIL DISIMPAN!';
      form.reset();
      btnSubmit.disabled = false;
      btnSubmit.innerText = '🚀 Simpan Data';

      // Refresh iframe rekap otomatis setelah 2 detik
      setTimeout(refreshRekap, 2000);
    })
    .catch(err => {
      statusMsg.style.backgroundColor = '#f8d7da';
      statusMsg.style.color = '#721c24';
      statusMsg.innerText = '❌ Gagal menyimpan data. Coba lagi.';
      btnSubmit.disabled = false;
      btnSubmit.innerText = '🚀 Simpan Data';
    });
  });
</script>

</body>
</html>
