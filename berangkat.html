<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Input & Rekap Keberangkatan Kapal</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f6; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    h2 { margin-top: 0; color: #333; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input[type="date"], button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background-color: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; }
    button:hover { background-color: #0056b3; }
    .btn-pdf { background-color: #dc3545; color: white; text-decoration: none; display: block; text-align: center; padding: 10px; border-radius: 4px; font-weight: bold; margin-top: 15px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #007bff; color: white; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    #status { margin-top: 10px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <!-- FORM INPUT -->
  <div class="card">
    <h2>🚢 Input Keberangkatan Kapal</h2>
    <form id="shipForm">
      <div class="form-group">
        <label for="namaKapal">Nama Kapal:</label>
        <select id="namaKapal" required>
          <option value="">-- Pilih Kapal --</option>
          <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
          <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
          <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
          <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
          <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
          <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
          <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
          <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
          <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
          <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
          <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
          <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
          <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
          <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
          <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>
          <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
        </select>
      </div>

      <div class="form-group">
        <label for="tanggalBerangkat">Tanggal Berangkat:</label>
        <input type="date" id="tanggalBerangkat" required>
      </div>

      <button type="submit" id="btnSubmit">Kirim Data</button>
    </form>
    <div id="status"></div>
  </div>

  <!-- REKAP DATA LIVE -->
  <div class="card">
    <h2>📋 Hasil Rekap Kapal Terinput (Live)</h2>
    <div id="tableContainer">Memuat data rekap...</div>

    <a href="https://docs.google.com/spreadsheets/d/1HcWZUa7Bsvxu0gMCJy6-vVHb-jklOGxrx7af9YCxNnI/export?format=pdf&size=A4&portrait=true&fitw=true" 
       target="_blank" 
       class="btn-pdf">
       📄 Unduh Rekap PDF
    </a>
  </div>
</div>

<script>
  function loadRekap() {
    google.script.run.withSuccessHandler(showTable).getDataRekap();
  }

  function showTable(data) {
    if (!data || data.length === 0) {
      document.getElementById('tableContainer').innerHTML = 'Belum ada data.';
      return;
    }

    let html = '<table><thead><tr>';
    // Header
    data[0].forEach(col => {
      html += `<th>${col}</th>`;
    });
    html += '</tr></thead><tbody>';

    // Baris Data
    for (let i = 1; i < data.length; i++) {
      html += '<tr>';
      data[i].forEach(cell => {
        let val = cell;
        if(typeof cell === 'string' && cell.includes('T')) {
           val = cell.split('T')[0];
        }
        html += `<td>${val}</td>`;
      });
      html += '</tr>';
    }
    html += '</tbody></table>';

    document.getElementById('tableContainer').innerHTML = html;
  }

  // Submit form
  document.getElementById('shipForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnSubmit');
    const status = document.getElementById('status');
    btn.disabled = true;
    status.innerText = 'Mengirim data...';

    const payload = {
      namaKapal: document.getElementById('namaKapal').value,
      tanggalBerangkat: document.getElementById('tanggalBerangkat').value
    };

    google.script.run.withSuccessHandler(function() {
      status.style.color = 'green';
      status.innerText = 'Data berhasil disimpan!';
      document.getElementById('shipForm').reset();
      btn.disabled = false;
      loadRekap(); // Refresh tabel secara langsung
    }).doPost({postData: {contents: JSON.stringify(payload)}});
  });

  // Muat rekap saat halaman pertama kali dibuka
  loadRekap();
</script>

</body>
</html>
