<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Jadwal Kapal & Rekap Data</title>
  <link rel="icon" type="image/png" href="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjdD6S02k7kXZ2T95ovWBCQpuHxOherr8qbplCWpwvkVWWm-oH3o-cBuXe6QV6ZI6OKf3-942MF3N8TiTLzgbB9nGOnvseOFkq4IkVc8ZC5yUObmXMUxnxyy6s6ciFRThKeuRXkBZCcowpVH4xIvegSyzjJNLoRGHwE96wlGNz41g4M6VKP2sL6BZ-XQhr-/s500/agas-88.png">

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #e9ecef;
      margin: 0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .card {
      background-color: #ffffff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      max-width: 650px;
      width: 100%;
    }
    .card-title {
      font-size: 1.2rem;
      font-weight: bold;
      text-align: center;
      padding-bottom: 10px;
      margin-bottom: 15px;
      border-bottom: 3px solid;
    }
    .arrival .card-title { color: #1d72b8; border-color: #1d72b8; }
    .departure .card-title { color: #d97706; border-color: #d97706; }
    .recap .card-title { color: #2b6cb0; border-color: #2b6cb0; }
    
    .form-group { margin-bottom: 12px; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 4px;
      color: #333;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 0.9rem;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #007bff;
    }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn-wa {
      flex: 2;
      background-color: #25d366;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-save-only {
      flex: 1;
      background-color: #3182ce;
      color: white;
      border: none;
      padding: 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 5px;
      cursor: pointer;
    }
    .btn-wa:hover { background-color: #1ebc57; }
    .btn-save-only:hover { background-color: #2b6cb0; }

    /* Header Tombol Rekap */
    .recap-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .recap-actions {
      display: flex;
      gap: 8px;
    }

    /* Style Tabel Rekap */
    .table-container { overflow-x: auto; margin-top: 10px; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    th, td {
      border: 1px solid #cbd5e0;
      padding: 8px;
      text-align: left;
    }
    th { background-color: #f7fafc; color: #2d3748; }
    .badge-arr {
      background-color: #ebf8ff;
      color: #2b6cb0;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .badge-dep {
      background-color: #fffaf0;
      color: #dd6b20;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
      font-size: 0.75rem;
    }
    .btn-action {
      padding: 4px 8px;
      font-size: 0.75rem;
      border: none;
      border-radius: 3px;
      cursor: pointer;
      color: white;
    }
    .btn-send { background-color: #25d366; }
    .btn-delete { background-color: #e53e3e; }
    
    .btn-pdf {
      background-color: #e53e3e;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }
    .btn-clear {
      background-color: #718096;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .btn-pdf:hover { background-color: #c53030; }
    .btn-clear:hover { background-color: #4a5568; }

    /* TAMPILAN CETAK/PDF */
    @media print {
      body {
        background-color: white;
        padding: 0;
      }
      .arrival, .departure, .recap-actions, .btn-action, th:last-child, td:last-child {
        display: none !important; /* Sembunyikan form dan kolom aksi saat di-print */
      }
      .card.recap {
        box-shadow: none;
        border: none;
        max-width: 100%;
        width: 100%;
        padding: 0;
      }
      .card-title {
        border-bottom: 2px solid #000;
        color: #000 !important;
      }
      table {
        font-size: 10pt;
      }
      th {
        background-color: #eee !important;
        -webkit-print-color-adjust: exact;
      }
    }
  </style>
</head>
<body>

  <!-- KARTU KEDATANGAN -->
  <div class="card arrival">
    <div class="card-title">KEDATANGAN KAPAL</div>
    <form id="formArrival">
      <div class="form-group">
        <label for="arrShip">Nama Kapal (KLM)</label>
        <select id="arrShip" required>
          <option value="">-- Pilih Kapal --</option>
          <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
          <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
          <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
          <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
          <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
          <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
          <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
          <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
          <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
          <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
          <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
          <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
          <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
          <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
          <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>
          <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
        </select>
      </div>

      <div class="form-group">
        <label for="arrOrigin">Asal</label>
        <select id="arrOrigin" required>
          <option value="">-- Pilih Asal --</option>
          <option value="SAMARINDA">SAMARINDA</option>
          <option value="TARAKAN">TARAKAN</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="arrDate">Tiba (Tgl)</label>
          <input type="date" id="arrDate" required>
        </div>
        <div class="form-group">
          <label for="arrTime">Jam</label>
          <input type="time" id="arrTime" required>
        </div>
        <div class="form-group">
          <label for="arrCrew">Crew</label>
          <input type="number" id="arrCrew" placeholder="4" required>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-save-only" onclick="processArrival(false)">Simpan Rekap</button>
        <button type="button" class="btn-wa" onclick="processArrival(true)">Kirim WA & Simpan</button>
      </div>
    </form>
  </div>

  <!-- KARTU KEBERANGKATAN -->
  <div class="card departure">
    <div class="card-title">KEBERANGKATAN KAPAL</div>
    <form id="formDeparture">
      <div class="form-group">
        <label for="depShip">Nama Kapal (KLM)</label>
        <select id="depShip" required>
          <option value="">-- Pilih Kapal --</option>
          <option value="KLM.SUMBER RIZKY">KLM.SUMBER RIZKY</option>
          <option value="KLM.SUMBER RIZKY 02">KLM.SUMBER RIZKY 02</option>
          <option value="KLM.SUMBER REZKY A">KLM.SUMBER REZKY A</option>
          <option value="KLM.ADI RAHMATULLAH PUTRA">KLM.ADI RAHMATULLAH PUTRA</option>
          <option value="KLM.SUMBER REZKY B">KLM.SUMBER REZKY B</option>
          <option value="KLM.QUDRAT ILAHI">KLM.QUDRAT ILAHI</option>
          <option value="KLM.FIRDAH JAYA 03">KLM.FIRDAH JAYA 03</option>
          <option value="KLM.SYUKRAN 3">KLM.SYUKRAN 3</option>
          <option value="KLM.SYUKRAN 03">KLM.SYUKRAN 03</option>
          <option value="KLM.BUNGA RIZKA">KLM.BUNGA RIZKA</option>
          <option value="KLM.SURYA UTAMA 77">KLM.SURYA UTAMA 77</option>
          <option value="KLM.MARHABAN 02">KLM.MARHABAN 02</option>
          <option value="KLM.BERKAT SABAR 05">KLM.BERKAT SABAR 05</option>
          <option value="KLM.BERKAH ILAHI 99">KLM.BERKAH ILAHI 99</option>
          <option value="KLM.SUMBER REZKY 88">KLM.SUMBER REZKY 88</option>
          <option value="KLM.ANUGERAH REZKY PUTRA">KLM.ANUGERAH REZKY PUTRA</option>
        </select>
      </div>

      <div class="form-group">
        <label for="depDestination">Tujuan</label>
        <select id="depDestination" required>
          <option value="">-- Pilih Tujuan --</option>
          <option value="SAMARINDA">SAMARINDA</option>
          <option value="TARAKAN">TARAKAN</option>
        </select>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="depDate">Brkt. Tgl</label>
          <input type="date" id="depDate" required>
        </div>
        <div class="form-group">
          <label for="depTime">Jam</label>
          <input type="time" id="depTime" required>
        </div>
        <div class="form-group">
          <label for="depCrew">Crew</label>
          <input type="number" id="depCrew" placeholder="5" required>
        </div>
      </div>

      <div class="btn-group">
        <button type="button" class="btn-save-only" onclick="processDeparture(false)">Simpan Rekap</button>
        <button type="button" class="btn-wa" onclick="processDeparture(true)">Kirim WA & Simpan</button>
      </div>
    </form>
  </div>

  <!-- KARTU REKAP DATA -->
  <div class="card recap">
    <div class="recap-header">
      <div class="card-title" style="margin:0; border:none; padding:0;">REKAP DATA KAPAL</div>
      <div class="recap-actions">
        <button class="btn-pdf" onclick="exportPDF()">📄 Export PDF</button>
        <button class="btn-clear" onclick="clearAllData()">Hapus Semua</button>
      </div>
    </div>
    
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Status</th>
            <th>Kapal</th>
            <th>Lokasi</th>
            <th>Tgl & Jam</th>
            <th>Crew</th>
            <th>Aksi</th>
          </tr>
        </thead>
        <tbody id="recapTableBody">
          <!-- Data tampil otomatis -->
        </tbody>
      </table>
    </div>
  </div>

<script>
  let shipRecords = [];

  window.onload = function() {
    loadRecords();
  };

  function loadRecords() {
    try {
      const data = localStorage.getItem('shipRecords');
      shipRecords = data ? JSON.parse(data) : [];
    } catch (e) {
      shipRecords = [];
    }
    renderRecapTable();
  }

  function formatArrDate(dateString) {
    if (!dateString) return "";
    const parts = dateString.split("-");
    return `${parseInt(parts[2], 10)}/${parseInt(parts[1], 10)}/${parts[0]}`;
  }

  function formatDepDate(dateString) {
    if (!dateString) return "";
    const parts = dateString.split("-");
    return `${parseInt(parts[2], 10)}-${parseInt(parts[1], 10)}-${parts[0]}`;
  }

  function processArrival(openWA) {
    const arrShip = document.getElementById('arrShip').value;
    const arrOrigin = document.getElementById('arrOrigin').value;
    const rawDate = document.getElementById('arrDate').value;
    const arrTime = document.getElementById('arrTime').value;
    const arrCrew = document.getElementById('arrCrew').value;

    if (!arrShip || !arrOrigin || !rawDate || !arrTime || !arrCrew) {
      alert("Harap isi semua kolom Kedatangan terlebih dahulu!");
      return;
    }

    const arrDate = formatArrDate(rawDate);
    const cleanShip = arrShip.replace("KLM.", "");

    const message = `KEDATANGAN
KLM  : ${cleanShip}
Asal  : ${arrOrigin}
Tiba. : ${arrDate}
Jam  : ${arrTime}
Crew : ${arrCrew}`;

    const newRecord = {
      id: Date.now(),
      type: 'KEDATANGAN',
      ship: cleanShip,
      location: arrOrigin,
      date: arrDate,
      time: arrTime,
      crew: arrCrew,
      rawMessage: message
    };
    
    shipRecords.unshift(newRecord);
    saveAndRender();

    if (openWA) {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
    } else {
      alert("Data Kedatangan berhasil disimpan ke Rekap!");
    }

    document.getElementById('formArrival').reset();
  }

  function processDeparture(openWA) {
    const depShip = document.getElementById('depShip').value;
    const depDestination = document.getElementById('depDestination').value;
    const rawDate = document.getElementById('depDate').value;
    const depTime = document.getElementById('depTime').value;
    const depCrew = document.getElementById('depCrew').value;

    if (!depShip || !depDestination || !rawDate || !depTime || !depCrew) {
      alert("Harap isi semua kolom Keberangkatan terlebih dahulu!");
      return;
    }

    const depDate = formatDepDate(rawDate);
    const cleanShip = depShip.replace("KLM.", "");

    const message = `KEBERANGKATAN 
KLM  : ${cleanShip}
TUJUAN     : ${depDestination}
BRKT. TGL : ${depDate}
JAM.      : ${depTime}
CREW      : ${depCrew}`;

    const newRecord = {
      id: Date.now(),
      type: 'KEBERANGKATAN',
      ship: cleanShip,
      location: depDestination,
      date: depDate,
      time: depTime,
      crew: depCrew,
      rawMessage: message
    };

    shipRecords.unshift(newRecord);
    saveAndRender();

    if (openWA) {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(message)}`, '_blank');
    } else {
      alert("Data Keberangkatan berhasil disimpan ke Rekap!");
    }

    document.getElementById('formDeparture').reset();
  }

  function saveAndRender() {
    try {
      localStorage.setItem('shipRecords', JSON.stringify(shipRecords));
    } catch (e) {
      console.error("Gagal menyimpan ke LocalStorage:", e);
    }
    renderRecapTable();
  }

  function renderRecapTable() {
    const tbody = document.getElementById('recapTableBody');
    tbody.innerHTML = '';

    if (!shipRecords || shipRecords.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#888; padding: 15px;">Belum ada data rekap tersimpan</td></tr>`;
      return;
    }

    shipRecords.forEach(rec => {
      const tr = document.createElement('tr');
      const badgeClass = rec.type === 'KEDATANGAN' ? 'badge-arr' : 'badge-dep';
      
      tr.innerHTML = `
        <td><span class="${badgeClass}">${rec.type}</span></td>
        <td>${rec.ship}</td>
        <td>${rec.location}</td>
        <td>${rec.date} (${rec.time})</td>
        <td>${rec.crew}</td>
        <td>
          <button class="btn-action btn-send" onclick="resendWA(${rec.id})">WA</button>
          <button class="btn-action btn-delete" onclick="deleteRecord(${rec.id})">X</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function resendWA(id) {
    const item = shipRecords.find(r => r.id === id);
    if (item) {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(item.rawMessage)}`, '_blank');
    }
  }

  function deleteRecord(id) {
    if (confirm("Hapus catatan ini dari rekap?")) {
      shipRecords = shipRecords.filter(r => r.id !== id);
      saveAndRender();
    }
  }

  function clearAllData() {
    if (confirm("Apakah kamu yakin ingin menghapus SEMUA data rekap?")) {
      shipRecords = [];
      saveAndRender();
    }
  }

  // FUNGSI EXPORT PDF
  function exportPDF() {
    if (!shipRecords || shipRecords.length === 0) {
      alert("Belum ada data rekap untuk diekspor ke PDF!");
      return;
    }
    window.print();
  }
</script>

</body>
</html>
