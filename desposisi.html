<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Lembar Disposisi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
        }

        .container {
            width: 210mm;
            min-height: 297mm;
            background: #fff;
            margin: auto;
            padding: 15mm;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        /* Kop Surat Gambar */
        .header-img {
            width: 100%;
            display: block;
            margin-bottom: 15px;
        }

        /* Title */
        .title {
            text-align: center;
            font-weight: bold;
            font-size: 16px;
            margin: 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Table Structure */
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th, td {
            border: 1px solid #000;
            padding: 6px 8px;
            vertical-align: top;
        }

        /* Kolom Titik Dua & Input */
        .titik-dua {
            width: 10px;
            text-align: center;
            padding-left: 2px;
            padding-right: 2px;
            border-right: none; /* Menyatu secara visual dengan isi */
        }

        .isi-field {
            border-left: none; /* Menyatu secara visual dengan titik dua */
        }

        /* Form Controls */
        input[type="text"], textarea {
            width: 100%;
            border: none;
            outline: none;
            font-family: inherit;
            font-size: 13px;
            background: transparent;
        }

        textarea {
            resize: vertical;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 6px;
        }

        .checkbox-group input {
            margin-right: 8px;
            transform: scale(1.2);
        }

        .signature-box {
            text-align: center;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-end;
            padding-right: 20px;
        }

        /* Print Settings */
        @media print {
            body { background: none; padding: 0; }
            .container { border: none; width: 100%; height: auto; }
            .no-print { display: none; }
        }
    </style>
</head>
<body>

    <div class="no-print" style="text-align: center; margin-bottom: 15px;">
        <button onclick="window.print()" style="padding: 10px 20px; font-size: 14px; cursor: pointer;">Cetak Lembar Disposisi</button>
    </div>

    <div class="container">
        <!-- Kop Surat Menggunakan Gambar -->
        <img src="https://res.cloudinary.com/kshynbri/image/upload/v1789746961/KOP-DESA-FIX_p0ahsk.png" alt="Kop Surat Desa" class="header-img">

        <!-- Judul -->
        <div class="title">Lembar Disposisi</div>

        <!-- Tabel Form Disposisi -->
        <table>
            <tr>
                <td width="15%">Surat Dari</td>
                <td class="titik-dua">:</td>
                <td class="isi-field" width="33%">
                    <input type="text" placeholder="Inspektorat Kabupaten Donggala">
                </td>
                <td width="18%">Diterima Tgl</td>
                <td class="titik-dua">:</td>
                <td class="isi-field" width="30%">
                    <input type="text" placeholder="07 September 2026">
                </td>
            </tr>
            <tr>
                <td>Tgl. Surat</td>
                <td class="titik-dua">:</td>
                <td class="isi-field">
                    <input type="text" placeholder="19 September 2026">
                </td>
                <td>No. Agenda</td>
                <td class="titik-dua">:</td>
                <td class="isi-field">
                    <input type="text" placeholder="063">
                </td>
            </tr>
            <tr>
                <td>No. Surat</td>
                <td class="titik-dua">:</td>
                <td class="isi-field">
                    <input type="text" placeholder="700/517/ITKAB/IX/2026">
                </td>
                <td>Sifat</td>
                <td class="titik-dua">:</td>
                <td class="isi-field">
                    <div style="display: flex; gap: 8px; font-size: 11px;">
                        <label><input type="checkbox"> S. Rahasia</label>
                        <label><input type="checkbox"> Segera</label>
                        <label><input type="checkbox"> Rahasia</label>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="6" style="height: 80px;">
                    <strong>Perihal :</strong>
                    <textarea rows="3" placeholder="Masukkan perihal surat di sini..."></textarea>
                </td>
            </tr>
            <tr>
                <td colspan="3" style="width: 50%;">
                    <strong>Diteruskan Kepada Sdra:</strong>
                    <div style="margin-top: 8px;">
                        <div class="checkbox-group"><label><input type="checkbox"> Sekdes</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kaur Tata Usaha & Umum</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kaur Keuangan</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kaur Perencanaan</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kasi Pemerintahan</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kasi Kesejahteraan</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Kasi Pelayanan</label></div>
                    </div>
                </td>
                <td colspan="3" style="width: 50%;">
                    <strong>Dengan Hormat Harap:</strong>
                    <div style="margin-top: 8px;">
                        <div class="checkbox-group"><label><input type="checkbox"> Tanggapan dan Saran</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Proses Lebih Lanjut</label></div>
                        <div class="checkbox-group"><label><input type="checkbox"> Koordinasi / Konfirmasi</label></div>
                    </div>
                    <div style="margin-top: 15px;">
                        <strong>Instruksi / Catatan Tambahan:</strong>
                        <textarea rows="4" placeholder="Tulis instruksi..."></textarea>
                    </div>
                </td>
            </tr>
            <tr>
                <td colspan="6" style="height: 180px;">
                    <strong>Catatan:</strong>
                    <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                        <div style="width: 50%;">
                            <textarea rows="6" placeholder="Tambahkan catatan jika ada..."></textarea>
                        </div>
                        <div class="signature-box" style="width: 40%;">
                            <div><strong>KEPALA DESA WANI DUA</strong></div>
                            <div style="margin-top: 60px;">
                                <strong><u>SUNARDIN, SE</u></strong>
                            </div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>
